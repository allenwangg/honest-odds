# CATALYST SPRINT — run ONLY in the windows below, contest config otherwise.
# Tue 8:35-10:30 CT (ISM+JOLTS 9:00) · Wed 8:30-10:00 (ADP reaction)
# Thu 8:25-10:30 (claims+ISM Svcs) · Fri: use config.event.yaml instead
universe: [SPY, QQQ, NVDA, TSLA, COIN]
max_dte: 2
min_dte: 1
event_offsets: [-0.02, -0.01, 0.0, 0.01, 0.02]
edge_threshold: 0.05
min_confidence: 0.55
max_trades_per_cycle: 4
kelly_scalar: 1.2
allow_spreads: true
convexity_mode: true
convexity_min_edge: 0.07
convexity_min_conf: 0.60
min_spread_width_frac: 0.005
max_breakeven_prob: 0.85
cross_frac: 0.65
cancel_stale_after_min: 8
slippage_buffer: 0.06
cycle_minutes: 5
options_feed: indicative
llm_backend: cli
model: claude-sonnet-5
risk:
  per_trade_max_frac: 0.12
  portfolio_heat_frac: 0.50
  daily_loss_halt_frac: 0.15
  per_underlying_frac: 0.35
  max_spread_frac: 0.30
  max_friction_frac: 0.45
  min_bid: 0.01
  stop_entries_min_before_close: 10
